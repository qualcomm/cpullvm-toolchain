ifndef BIN_PATH
    BIN_PATH=../../../bin
endif

ifndef LIBC
    LIBC=picolibc
endif

ifndef TARGET
    TARGET=riscv32
endif

# Compiler options and QEMU command line for each supported target. The
# compiler options select a library variant whose default memory map, used by
# the C library's linker script, fits the memory of the emulated machine.
# QEMU_LOAD takes the image to load as its argument. The virt machines place a
# device tree at the start of RAM when using "-device loader", so they load the
# image with "-kernel" instead.
ifeq ($(TARGET),arm)
    TARGET_FLAGS=--target=arm-none-eabi -march=armv7m -mfpu=none -mfloat-abi=soft
    QEMU=qemu-system-arm -M mps2-an385 -cpu cortex-m3
    QEMU_LOAD=-device loader,file=$(1),cpu-num=0
else ifeq ($(TARGET),aarch64)
    TARGET_FLAGS=--target=aarch64-none-elf -march=armv8-a
    QEMU=qemu-system-aarch64 -M virt -cpu cortex-a57
    QEMU_LOAD=-kernel $(1)
else ifeq ($(TARGET),riscv32)
    TARGET_FLAGS=--target=riscv32-unknown-elf -march=rv32imac -mabi=ilp32
    QEMU=qemu-system-riscv32 -M virt -cpu rv32 -bios none
    QEMU_LOAD=-kernel $(1)
else ifeq ($(TARGET),riscv32-xqci)
    # The Xqci extensions require a dedicated QEMU build, see the Prerequisites
    # section of docs/building.md.
    TARGET_FLAGS=--target=riscv32-unknown-elf -march=rv32ima_zawrs_zacas_zabha_zba_zbb_zbs_zca_zcb_zilsd_zclsd_xqcia_xqciac_xqcibi_xqcibm_xqcicli_xqcicm_xqcics_xqcicsr_xqciint_xqciio_xqcilb_xqcili_xqcilia_xqcilo_xqcilsm_xqcisim_xqcisls_xqcisync_xqccmp_xqccmt0p1 -menable-experimental-extensions -mabi=ilp32
    QEMU=qemu-system-riscv32-xqci -M virt -cpu rv32,zcd=false,d=false,a=true,zawrs=true,zacas=true,zabha=true,zcb=true,zcmp=false,zilsd=true,zclsd=true,f=false,zfa=false,xqci=true,xqccmp=true,zca=true,xqccmt=true -bios none
    QEMU_LOAD=-kernel $(1)
else ifeq ($(TARGET),riscv64)
    TARGET_FLAGS=--target=riscv64-unknown-elf -march=rv64imac -mabi=lp64 -mcmodel=medany
    QEMU=qemu-system-riscv64 -M virt -cpu rv64 -bios none
    QEMU_LOAD=-kernel $(1)
else
    $(error Unsupported TARGET=$(TARGET))
endif

# ELD is the recommended linker for embedded images. ELD does not rescan
# archives, so libsemihost must come after libc to resolve libc's references
# into it.
LINKER=-fuse-ld=eld
CRT_SEMIHOST=-nostartfiles -lcrt0-semihost -lc -lsemihost

# The C++ libraries are built without exceptions and RTTI for most targets.
CPP_FLAGS=-fno-exceptions -fno-rtti

ifeq ($(LIBC),picolibc)
    CFG_FILE=
    LIBC_LD_FILE=picolibcpp.ld
else
    $(error Unsupported LIBC=$(LIBC))
endif

QEMU_SEMIHOSTING=-nographic \
-chardev stdio,mux=on,id=stdio0 \
-semihosting-config enable=on,chardev=stdio0 \
-monitor none -serial none
