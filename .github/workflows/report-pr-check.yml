name: Report PR check

on:
  workflow_call:
    inputs:
      check_name:
        required: true
        type: string
      status_context:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      pr_sha:
        required: true
        type: string
      build_result:
        required: true
        type: string
      test_result:
        required: true
        type: string
      run_url:
        required: true
        type: string
      post_comment:
        required: false
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write
  statuses: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Report workflow result on the PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CHECK_NAME: ${{ inputs.check_name }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          BUILD_RESULT: ${{ inputs.build_result }}
          TEST_RESULT: ${{ inputs.test_result }}
          RUN_URL: ${{ inputs.run_url }}
          POST_COMMENT: ${{ inputs.post_comment }}
        with:
          github-token: ${{ github.token }}
          script: |
            const buildResult = process.env.BUILD_RESULT;
            const testResult = process.env.TEST_RESULT;
            const passed = buildResult === 'success' && testResult === 'success';
            const message = passed
              ? `✅ ${process.env.CHECK_NAME} passed for \`${process.env.PR_SHA}\`.`
              : `❌ ${process.env.CHECK_NAME} failed for \`${process.env.PR_SHA}\`.`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_SHA,
              state: passed ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              target_url: process.env.RUN_URL,
              description: message,
            });

            if (process.env.POST_COMMENT === 'true') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: `${message} [View workflow run](${process.env.RUN_URL}).`,
              });
            }
