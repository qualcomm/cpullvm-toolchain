name: '[DNM] 23.x LLDB Linux AArch64 Verification'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lldb-linux-arm64-verification.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify-lldb:
    if: github.repository == 'qualcomm/cpullvm-toolchain'
    name: Verify LLDB libedit on Linux AArch64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout artifact download action
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: .github/actions/fetch-linux-toolchain

      - name: Install LLDB runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libedit2 libxml2 python3-pexpect

      - name: Fetch Linux AArch64 toolchain
        uses: ./.github/actions/fetch-linux-toolchain
        with:
          github-token: ${{ github.token }}
          run-id: '44456183345'
          package-name: cpullvm-packages-build_copy_runtimes.sh-Linux-AArch64
          install-dir: ${{ runner.temp }}/cpullvm

      - name: Verify LLDB links libedit
        env:
          TOOLCHAIN_DIR: ${{ runner.temp }}/cpullvm
        run: |
          "$TOOLCHAIN_DIR/bin/llvm-readelf" --dynamic "$TOOLCHAIN_DIR/bin/lldb" | grep 'Shared library: \[libedit.so.2\]'
          ldd "$TOOLCHAIN_DIR/bin/lldb" | grep 'libedit.so.2'

      - name: Verify interactive LLDB editing and Python
        env:
          TOOLCHAIN_DIR: ${{ runner.temp }}/cpullvm
        run: |
          python3 - <<'PY'
          import os
          import pexpect

          lldb = os.path.join(os.environ['TOOLCHAIN_DIR'], 'bin', 'lldb')
          child = pexpect.spawn(lldb, encoding='utf-8', timeout=30)
          child.expect(r'\(lldb\) ')

          child.send('vers\t')
          child.expect('version')
          child.sendline('')
          child.expect('lldb version')
          child.expect(r'\(lldb\) ')

          child.send('help prnit')
          child.send('\x1b[D\x1b[D\x7fn')
          child.sendline('')
          child.expect('Syntax: print')
          child.expect(r'\(lldb\) ')

          child.sendline('expression 1')
          child.expect(r'= 1')
          child.expect(r'\(lldb\) ')
          child.send('\x1b[A')
          child.sendline('')
          child.expect(r'= 1')
          child.expect(r'\(lldb\) ')

          child.sendline('script print("python-ok")')
          child.expect('python-ok')
          child.sendline('quit')
          child.expect(pexpect.EOF)
          PY
