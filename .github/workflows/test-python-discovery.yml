# Test workflow to discover Python installations on GitHub-hosted Windows runners

name: Test - Python Discovery

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  discover-python:
    name: Python on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
          - windows-11-arm
    
    steps:
      - name: List Python installations
        shell: pwsh
        run: |
          Write-Host "Python installations on ${{ matrix.runner }}:"
          Write-Host ""
          Get-ChildItem -Path "C:\hostedtoolcache\windows\Python\*\x64\python.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            $version = & $_.FullName --version 2>&1
            Write-Host "$version"
          }
