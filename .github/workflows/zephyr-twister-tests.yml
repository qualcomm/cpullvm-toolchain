name: Zephyr Twister Tests

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: >
          Run ID of a cpullvm-toolchain workflow that built the Linux x86_64 toolchain.
          Leave blank to use the latest nightly.
        required: false
        default: ''
      package-name:
        description: >
          Package name of the toolchain to download. Defaults to 'cpullvm-packages-build.sh-Linux-x86'.
          Only Linux packages should be used.
        required: false
        default: cpullvm-packages-build.sh-Linux-x86
  schedule:
    - cron: '0 5 * * 1' # Sunday 21:00 PST (Monday 05:00 UTC)
  pull_request:
    paths:
      - '.github/workflows/zephyr-twister-tests.yml'

permissions:
  contents: read

jobs:
  run-twister-tests:
    if: github.repository == 'qualcomm/cpullvm-toolchain'
    name: Twister tests for ${{ matrix.platform }} (${{ matrix.subset }}/2)
    # Zephyr's tests take a relatively long time to complete but can be split to
    # run in parallel on different machines fairly easily (by platform/arch,
    # using `--subset`, etc.). So let's use Github's runners to avoid tying up
    # our (limited in number) self-hosted runners for hours at a time.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:main
      # Work around a mismatch between UIDs, see https://github.com/actions/checkout/issues/956
      options: '--user 0'

    strategy:
      fail-fast: false
      matrix:
        platform: [qemu_riscv32, qemu_riscv32_xip, qemu_riscv64, qemu_cortex_a53, qemu_cortex_m3, qemu_cortex_a9]
        subset: [1, 2]

    steps:
      - name: Clone Zephyr
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: zephyrproject-rtos/zephyr

      # We must also add the repository as a safe.directory, otherwise we get
      # errors about "dubious ownership". See https://github.com/actions/checkout/issues/2031
      - name: Set safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout fetch-linux-toolchain action
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: .github/actions/fetch-linux-toolchain
          path: .cpullvm

      - name: Fetch toolchain
        uses: ./.cpullvm/.github/actions/fetch-linux-toolchain
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          package-name: ${{ inputs.package-name || 'cpullvm-packages-build.sh-Linux-x86' }}

      - name: West setup
        run: |
          west init -l .
          west update

      # Source hosttools (including qemu) from the Zephyr SDK.
      - name: Install Zephyr SDK hosttools
        run: |
          west sdk install --no-gnu-toolchains --install-base /opt/toolchains

      - name: Run Twister tests
        shell: bash
        run: |
          source zephyr-env.sh
          export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/
          export ZEPHYR_TOOLCHAIN_VARIANT=host/llvm
          export LLVM_TOOLCHAIN_PATH=/opt/cpullvm/

          west twister -W \
            -p ${{ matrix.platform }} \
            -j 3 \
            --inline-logs \
            --force-toolchain \
            --subset ${{ matrix.subset }}/2 \
            -x=CONFIG_LLVM_USE_ELD=y \
            -x=CONFIG_COMPILER_RT_RTLIB=y

      - name: Upload Twister results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: zephyr-twister-test-results-${{ matrix.platform }}-subset-${{ matrix.subset }}
          path: |
            twister-out/twister.log
            twister-out/twister.xml
            twister-out/twister.json

  merge-twister-results:
    if: always() && github.repository == 'qualcomm/cpullvm-toolchain'
    name: Merge Twister XML results
    needs: run-twister-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Download split XML results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: split_xml

      - name: Install junitparser
        run: |
          pip install junitparser

      - name: Merge split XML results
        run: |
          junitparser merge --glob "split_xml/**/twister.xml" merged_twister.xml

      - name: Upload merged XML results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zephyr-merged-twister-test-results
          path: merged_twister.xml

  #Generate comparison report xlxs format.
  generate-comparison-report:
    # Run even if tests or merging had failures — we still want a report.
    if: always() && github.repository == 'qualcomm/cpullvm-toolchain'
    name: Generate XLSX comparison report
    needs: merge-twister-results
    runs-on: ubuntu-24.04

    steps:
      # Sparse-checkout only the report script
      # We only need one Python file from cpullvm-toolchain; sparse-checkout
      # avoids pulling the entire repository history.
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: qualcomm/cpullvm-toolchain
          sparse-checkout: .github/scripts/generate_twister_report.py

      # Download THIS run's merged XML
      # Fetches the artifact produced by the merge-twister-results job above
      # and places it under current/merged_twister.xml.
      - name: Download current merged XML
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: zephyr-merged-twister-test-results
          path: current

      # Locate the most recent previously completed run
      # Uses `gh run list` to find the last completed run of this workflow
      # that is NOT the current run. The run ID is stored as a step output
      # so the download and date-label steps can reference it.
      - name: Find previous completed run ID
        id: prev-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PREV_RUN_ID=$(gh run list             
          --workflow zephyr-twister-tests.yml             
          --status completed             
          --limit 10             
          --json databaseId,conclusion             
          --jq '[.[] | select(.databaseId != $ENV.RUN_ID)] | first | .databaseId'             
          --repo ${{ github.repository }})
          echo "Previous run ID: $PREV_RUN_ID"
          echo "run_id=$PREV_RUN_ID" >> "$GITHUB_OUTPUT"

      # Download the previous run's merged XML
      # `|| true` prevents the job from failing if the artifact has expired
      # (artifacts are retained for 90 days by default). The next step handles
      # the missing-file case by injecting an empty placeholder XML.
      - name: Download previous merged XML
        if: steps.prev-run.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ steps.prev-run.outputs.run_id }}             
          --name zephyr-merged-twister-test-results             
          --dir previous             
          --repo ${{ github.repository }} || true

      # Inject empty placeholder XML when no previous run exists
      # Handles two edge cases: (a) this is the very first ever run of the
      # workflow, or (b) the previous artifact has already expired/been deleted.
      # An empty <testsuites/> is valid JUnit XML that the script treats as zero tests.
      - name: Create empty previous XML if missing
        run: |
          if [ ! -f previous/merged_twister.xml ]; then
            echo "No previous results found – creating empty placeholder."
            echo '<testsuites/>' > previous/merged_twister.xml
          fi

      #Derive human-readable date labels for the report columns
      # The XLSX report uses "MMM DD" column headers (e.g. "Jul 28" / "Jul 29").
      # Current date is taken from the runner clock; previous date is fetched
      # from the GitHub API using the run ID resolved in Step 3.
      - name: Compute date labels
        id: dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURR_DATE=$(date -u +"%b %d")
          if [ -n "${{ steps.prev-run.outputs.run_id }}" ]; then
            PREV_DATE=$(gh run view ${{ steps.prev-run.outputs.run_id }}               
            --json createdAt --jq '.createdAt'               
            --repo ${{ github.repository }}               
            | xargs -I{} date -u -d {} +"%b %d" 2>/dev/null || echo "Prev Run")
          else
            PREV_DATE="Prev Run"
          fi
          echo "curr_date=$CURR_DATE" >> "$GITHUB_OUTPUT"
          echo "prev_date=$PREV_DATE" >> "$GITHUB_OUTPUT"

      # Install Python dependencies for the report script
      # openpyxl writes the .xlsx file; junitparser parses the merged XML files.
      - name: Install Python dependencies
        run: pip install junitparser openpyxl

      # Run the comparison report generator
      # Passes both XMLs, date labels, and the output path to the script.
      # Script lives at .github/scripts/generate_twister_report.py (checked out above).
      - name: Generate XLSX report
        run: |
          python .github/scripts/generate_twister_report.py \
            --prev previous/merged_twister.xml \
            --curr current/merged_twister.xml  \
            --out  twister_comparison_report.xlsx \
            --prev-date "${{ steps.dates.outputs.prev_date }}" \
            --curr-date "${{ steps.dates.outputs.curr_date }}"

      # Upload the finished XLSX as a downloadable artifact
      # `if: always()` ensures the report is uploaded even if some tests regressed.
      # Downloadable from the Actions run summary page as 'zephyr-twister-comparison-report'.
      - name: Upload XLSX report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: zephyr-twister-comparison-report
          path: twister_comparison_report.xlsx
