name: PR Comment Router
run-name: "PR workflow request #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'qualcomm/cpullvm-toolchain' && github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: read
    outputs:
      command: ${{ steps.request.outputs.command }}
      ref: ${{ steps.request.outputs.ref }}
      comment_id: ${{ steps.request.outputs.comment_id }}
    steps:
      - name: Validate workflow request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const comment = process.env.COMMENT_BODY.trim();
            if (!comment.startsWith('/run')) {
              core.info('Ignoring unrelated comment.');
              return;
            }

            const commands = new Map([
              ['/run nightly', 'nightly'],
              ['/run nightly-release', 'nightly-release'],
            ]);
            const command = commands.get(comment);
            const reply = async (body) => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            if (!command) {
              await reply('Unsupported workflow request. Use `/run nightly` or `/run nightly-release`.');
              return;
            }

            let authorized = false;
            try {
              const membership = await github.rest.teams.getMembershipForUserInOrg({
                org: 'qualcomm',
                team_slug: 'cpullvm-toolchain-write',
                username: context.payload.comment.user.login,
              });
              authorized = membership.data.state === 'active';
            } catch (error) {
              core.info(`Unable to verify team membership: ${error.message}`);
            }
            if (!authorized) {
              await reply(`@${context.payload.comment.user.login} is not authorized to run pull request workflows.`);
              return;
            }

            const pullRequest = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })).data;
            if (pullRequest.head.repo.full_name !== context.payload.repository.full_name) {
              await reply('Workflow requests are only supported for pull requests from this repository.');
              return;
            }
            if (!pullRequest.merge_commit_sha) {
              await reply('GitHub has not created a merge commit for this pull request. Resolve merge conflicts and try again.');
              return;
            }

            const ref = pullRequest.merge_commit_sha;
            const marker = `<!-- pr-workflow:${command}:${ref} -->`;
            const requestComment = await reply([
              marker,
              `Running \`${comment}\` for merge commit \`${ref}\`.`,
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n\n'));

            core.setOutput('command', command);
            core.setOutput('ref', ref);
            core.setOutput('comment_id', String(requestComment.data.id));

  nightly:
    needs: validate
    if: needs.validate.outputs.command == 'nightly'
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}
      enable_assertions: true
    permissions:
      contents: read
    concurrency:
      group: pr-workflow-${{ github.event.issue.number }}
      cancel-in-progress: true

  nightly-release:
    needs: validate
    if: needs.validate.outputs.command == 'nightly-release'
    uses: ./.github/workflows/nightly-release.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}
    permissions:
      contents: read
    concurrency:
      group: pr-workflow-${{ github.event.issue.number }}
      cancel-in-progress: true

  report:
    needs: [validate, nightly, nightly-release]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.validate.outputs.command == 'nightly' || needs.validate.outputs.command == 'nightly-release')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Update workflow request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMAND: ${{ needs.validate.outputs.command }}
          COMMENT_ID: ${{ needs.validate.outputs.comment_id }}
          REF: ${{ needs.validate.outputs.ref }}
          NIGHTLY_RESULT: ${{ needs.nightly.result }}
          NIGHTLY_RELEASE_RESULT: ${{ needs.nightly-release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = process.env.COMMAND === 'nightly'
              ? process.env.NIGHTLY_RESULT
              : process.env.NIGHTLY_RELEASE_RESULT;
            const status = result === 'success'
              ? 'passed'
              : result === 'cancelled'
                ? 'was cancelled'
                : 'failed';
            const command = `/run ${process.env.COMMAND}`;
            const body = [
              `<!-- pr-workflow:${process.env.COMMAND}:${process.env.REF} -->`,
              `\`${command}\` ${status} for merge commit \`${process.env.REF}\`.`,
              `[View workflow run](${process.env.RUN_URL})`,
            ].join('\n\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body,
            });
