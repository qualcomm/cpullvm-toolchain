# Nightly Release build — calls nightly.yml with assertions disabled
# (Release mode) by passing enable_assertions: false.

name: Nightly Release Build and Test

on:
  workflow_dispatch:
    inputs:
      pr_sha:
        description: 'Exact pull request head SHA'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      pr_sha:
        description: 'Exact pull request head SHA'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/nightly-release.yml'

permissions:
  contents: read

# Cancel in-progress runs for `pull_request` events only.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-release:
    uses: ./.github/workflows/nightly.yml
    permissions:
      contents: read
    with:
      enable_assertions: false
      pr_sha: ${{ inputs.pr_sha }}
