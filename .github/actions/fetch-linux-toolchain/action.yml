name: Fetch cpullvm Linux toolchain
description: >
  Downloads and extracts a CPULLVM Linux toolchain. Windows toolchains and hosts
  are currently unsupported. Artifacts containing multiple packages or toolchains
  are also unsupported.

inputs:
  github-token:
    description: >
      Token with actions:read permission on qualcomm/cpullvm-toolchain.
      Within this repo, github.token works. External callers need a
      fine-grained PAT or GitHub App token scoped to qualcomm/cpullvm-toolchain.
    required: true
  run-id:
    description: >
      Run ID of a qualcomm/cpullvm-toolchain workflow that uploaded the toolchain artifact.
      Leave blank to use the latest successful nightly.yml run.
    required: false
    default: ''
  package-name:
    description: >
      Package name of the toolchain to download. Defaults to 'cpullvm-packages-build.sh-Linux-x86'.
      Only Linux packages should be used.
    required: false
    default: cpullvm-packages-build.sh-Linux-x86
  install-dir:
    description: Directory to extract the toolchain into.
    required: false
    default: /opt/cpullvm
  job-name:
    description: >
      Name of the nightly.yml job that must have succeeded for a run to be selected.
      Only used when run-id is not specified.
    required: false
    default: 'build.sh on Linux-x86_64'
  max-age-days:
    description: >
      How many days back to search for a passing run. Defaults to 7 to match the
      artifact retention period in nightly.yml. Only used when run-id is not specified.
    required: false
    default: '7'

runs:
  using: composite
  steps:
    - name: Get latest nightly run ID
      id: latest
      if: inputs.run-id == ''
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        JOB_NAME: ${{ inputs.job-name }}
        MAX_AGE_DAYS: ${{ inputs.max-age-days }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const JOB_NAME = process.env.JOB_NAME;
          const MAX_AGE_MS = parseInt(process.env.MAX_AGE_DAYS, 10) * 24 * 60 * 60 * 1000;
          const cutoff = new Date(Date.now() - MAX_AGE_MS);
          let page = 1;
          while (true) {
            const resp = await github.rest.actions.listWorkflowRuns({
              owner: 'qualcomm',
              repo: 'cpullvm-toolchain',
              workflow_id: 'nightly.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 10,
              page,
            });
            if (!resp.data.workflow_runs?.length) break;
            for (const run of resp.data.workflow_runs) {
              if (new Date(run.created_at) < cutoff) {
                throw new Error(`No completed nightly run found where '${JOB_NAME}' succeeded within the last ${process.env.MAX_AGE_DAYS} day(s)`);
              }
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: 'qualcomm',
                repo: 'cpullvm-toolchain',
                run_id: run.id,
              });
              const Job = jobs.data.jobs.find(j => j.name === JOB_NAME);
              if (Job?.conclusion === 'success') {
                core.info(`Using run id=${run.id}, number=${run.run_number}`);
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            page++;
          }
          throw new Error(`No completed nightly run found where '${JOB_NAME}' succeeded within the last ${process.env.MAX_AGE_DAYS} day(s)`);

    - name: Download toolchain artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: ${{ inputs.package-name }}
        github-token: ${{ inputs.github-token }}
        repository: qualcomm/cpullvm-toolchain
        run-id: ${{ inputs.run-id || steps.latest.outputs.run_id }}

    - name: Extract toolchain
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      shell: bash
      run: |
        mkdir -p "$INSTALL_DIR"
        tarball=$(find . -name 'cpullvm-*.tar.xz' -print -quit)
        tar -xf "$tarball" --strip-components=1 -C "$INSTALL_DIR"
